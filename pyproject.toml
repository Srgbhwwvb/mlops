[project]
name = "mlops"
version = "0.9.0"
requires-python = ">=3.9.20"
readme = "README.md"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "scikit-learn==1.6.0",
    "pandas==2.3.3",
    "pillow==11.3.0",
    "tqdm==4.67.1",
    "PyYAML==6.0.3",
    "transformers==4.57.3",
    "timm==1.0.22",
    
    "dvc==3.65.0",
    "dvc_ssh==4.2.2"
]

[project.optional-dependencies]
dev = [
    "ty==0.0.8",
    "ruff==0.14.10",
    "codecov==2.1.13",
    
    "taskipy==1.14.1"
]
test = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    
    "taskipy==1.14.1"
]
mlflow = [
    "mlflow==3.8.1"
]
api = [
    "fastapi==0.128.0",
    "python-multipart==0.0.20",
    "uvicorn==0.39.0"
]
torchserve = [
    "torchserve==0.12.0",
    "torch-model-archiver==0.12.0",
    "torch-workflow-archiver==0.2.15"
]

[tool.taskipy.tasks]
lint = "ruff format --check & ruff check & ty check"
fmt  = "ruff format"
test = "pytest tests/ -v --cov=src --cov-report=xml"

[project.scripts]
predict    = "predict:main"
setup_data = "setup_data:main"
train      = "train_model:main"
validate   = "validate_model:main"
api        = "predict_server:main"

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
]
ignore = [
    "G004", "COM812", 
    "TRY003", "EM101", "EM102", "T201",
    "PTH207",
    "D", "S",
    "FA100"
]

[tool.mlflow]
tracking_uri = "file:./mlruns"
experiment_name = "default"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = [
    "setuptools==80.9.0",
    "wheel"
]
build-backend = "setuptools.build_meta"
