stages:
  prepare:
    cmd: python scripts/setup_data.py --config config/train_config.yaml
    deps:
      - scripts/setup_data.py
      - config/train_config.yaml
    outs:
      - data/prepared_data

  train:
    cmd: python scripts/train.py --config configs/train_config.yaml
    deps:
      - scripts/train.py
      - config/train_config.yaml
    outs:
      - models/best_model
      - logs/training_log

  evaluate:
    cmd: python scripts/validate.py --config config/train_config.yaml --model_path models/best_model
    deps:
      - scripts/validate.py
      - models/best_model
      - config/train_config.yaml
    outs: []
    