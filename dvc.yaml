stages:
  prepare:
    cmd: setup_data --config configs/train_config.yaml
    deps:
      - data/initial_data
      - configs/train_config.yaml
      - src/setup_data.py
    outs:
      - data/prepared_data

  train:
    cmd: train --config configs/train_config.yaml
    deps:
      - data/prepared_data
      - configs/train_config.yaml
      - src/train_model.py
    outs:
      - models/best_model
      - models/final_model

  validate:
    cmd: validate --config configs/train_config.yaml --model_path models/best_model
    deps:
      - models/best_model
      - configs/train_config.yaml
      - src/validate_model.py
    outs: []
